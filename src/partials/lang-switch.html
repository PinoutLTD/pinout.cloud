<div class="lang-switch">
  <label class="lang-switch__label" for="site-lang">
    <span class="visually-hidden">@lang_label</span>
    <span class="lang-switch__icon" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.25"/>
        <path d="M1.75 8h12.5M8 1.75c1.5 1.75 2.25 4.08 2.25 6.25S9.5 12.5 8 14.25M8 1.75C6.5 3.5 5.75 5.83 5.75 8s.75 4.5 2.25 6.25" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
      </svg>
    </span>
    <select class="lang-switch__select" id="site-lang" name="lang">
      <option value="en">@lang_optionEn</option>
      <option value="ru">@lang_optionRu</option>
    </select>
  </label>
</div>
