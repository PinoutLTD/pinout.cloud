<!DOCTYPE html>
<html lang="@htmlLang">
  @include('../../partials/head.html', {
    "pageTitle": "@meta_shopTitle",
  })
<body data-shop-available="@shopPage_available" data-shop-not-available="@shopPage_notAvailable" data-shop-loading="@shopPage_loading">
  <!-- website header -->
  @include('../../partials/header.html')

  <main class="shop">
    <section class="shop-section">
      <div class="layout">
        <div class="shop-header">
          <div class="shop-header__title">
            <h1 class="page-title">@shopPage_heading</h1>
            <p class="text-normal">@shopPage_deliveryNote</p>
          </div>
          <p class="text-normal">@shopPage_intro</p>
        </div>

        <div class="shop-content grid grid-4" id="products-container">
          <!-- Products are loaded via JavaScript -->
        </div>
      </div>
    </section>
  </main>

  <!-- website footer -->
  @include('../../partials/footer.html')
</body>
</html>
