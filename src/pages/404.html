<!DOCTYPE html>
<html lang="@htmlLang">
  @include('../partials/head.html', {
    "pageTitle": "@meta_notFoundTitle",
  })
<body>
  <!--  website header -->
  @include('../partials/header.html')

  <main>
    <section class="page-404">
      <div class="layout page-404__layout">
        <div class="page-404__terminal">
          <img src="/img/404-terminal.svg" alt="" aria-hidden="true"/>
        </div>
        <p class="text text-with-bg text page-404__text-with-bg">
          <span>@notFound_line1</span><br/>
          <span>@notFound_line2</span>
        </p>
        <a href="@localePrefix/" aria-label="@notFound_homeAria" class="link-font underline link-with-arrow page-404__link">@notFound_homeLink</a>
      </div>

      <img class="page-404__img" src="/img/home-banner.png" alt="" aria-hidden="true"/>
    </section>
  </main>

</body>
</html>
